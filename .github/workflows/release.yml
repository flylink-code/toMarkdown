name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      - name: Build executable
        run: pyinstaller --noconfirm tomarkdown.spec

      - name: Prepare release package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $$ver = $env:RELEASE_TAG.Substring(1)
          $$archiveName = 'toMarkdown-v' + $$ver + '-windows-x64.zip'
          Compress-Archive -Path "dist/toMarkdown/*" -DestinationPath ('dist/' + $$archiveName)
          ('ARCHIVE_NAME=' + $$archiveName) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $$ver = $env:RELEASE_TAG.Substring(1)
          $$parts = $$ver.Split('.')
          $$wixVer = if ($$parts.Count -eq 3) { '{0}.0' -f $$ver } else { $$ver }
          heat dir "dist/toMarkdown" -cg AppFiles -dr INSTALLFOLDER -gg -srd -sreg -out "installer/HarvestedFiles.wxs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & candle @('-dVersion=' + $$wixVer, '-out', 'installer/', 'installer/Product.wxs', 'installer/HarvestedFiles.wxs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $$msiName = 'toMarkdown-v' + $$ver + '-windows-x64.msi'
          & light -sval -out ('dist/' + $$msiName) 'installer/Product.wixobj' 'installer/HarvestedFiles.wixobj'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ('MSI_NAME=' + $$msiName) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/${{ env.ARCHIVE_NAME }}
            dist/${{ env.MSI_NAME }}
          draft: false
          prerelease: false
