name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build executable
        run: pyinstaller --noconfirm tomarkdown.spec

      - name: Prepare release package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $env:PKG_VERSION = $env:RELEASE_TAG.Substring(1)
          $env:ARCHIVE_NAME = "toMarkdown-v$($env:PKG_VERSION)-windows-x64.zip"
          Compress-Archive -Path "dist/toMarkdown/*" -DestinationPath "dist/$($env:ARCHIVE_NAME)"
          "ARCHIVE_NAME=$($env:ARCHIVE_NAME)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build NSIS installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $env:PKG_VERSION = $env:RELEASE_TAG.Substring(1)
          & makensis "/DAPP_VERSION=$($env:PKG_VERSION)" "installer/toMarkdown.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:INSTALLER_NAME = "toMarkdown-v$($env:PKG_VERSION)-windows-x64-setup.exe"
          "INSTALLER_NAME=$($env:INSTALLER_NAME)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/${{ env.ARCHIVE_NAME }}
            dist/${{ env.INSTALLER_NAME }}
          draft: false
          prerelease: false
