name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      - name: Build executable
        run: pyinstaller --noconfirm tomarkdown.spec

      - name: Prepare release package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $archiveName = "toMarkdown-v$version-windows-x64.zip"
          Compress-Archive -Path "dist/toMarkdown/*" -DestinationPath "dist/$archiveName"
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          heat dir "dist/toMarkdown" -cg AppFiles -dr INSTALLFOLDER -gg -srd -out "installer/HarvestedFiles.wxs"
          candle -dVersion=$version -out "installer/" "installer/Product.wxs" "installer/HarvestedFiles.wxs"
          $msiName = "toMarkdown-v$version-windows-x64.msi"
          light -out "dist/$msiName" "installer/Product.wixobj" "installer/HarvestedFiles.wixobj"
          "MSI_NAME=$msiName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/${{ env.ARCHIVE_NAME }}
            dist/${{ env.MSI_NAME }}
          draft: false
          prerelease: false
