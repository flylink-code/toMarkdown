[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tomarkdown"
version = "0.1.0"
description = "Batch convert Word (.docx) files to Markdown using markitdown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markitdown[docx]>=0.1.0",
    "customtkinter>=5.2.0",
    "tkinterdnd2>=0.4.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tomarkdown*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
